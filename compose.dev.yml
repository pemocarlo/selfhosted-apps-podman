services:
  hello-api:
    build:
      context: ./services/hello-api
      dockerfile: Containerfile
    image: localhost/hello-api:latest
    container_name: hello-api-dev
    ports:
      - "127.0.0.1:8000:8000"

  hello-web:
    image: docker.io/library/node:22-alpine
    container_name: hello-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./services/hello-web:/app:Z
    depends_on:
      - hello-api
