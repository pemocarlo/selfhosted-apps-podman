<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello from Caddy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(42rem, 100%);
        padding: 2rem;
        border: 1px solid rgb(148 163 184 / 0.25);
        border-radius: 1.25rem;
        background: linear-gradient(145deg, rgb(15 23 42 / 0.94), rgb(30 41 59 / 0.88));
        box-shadow: 0 24px 70px rgb(2 6 23 / 0.45);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.7;
        color: #cbd5e1;
      }

      code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.4rem;
        background: rgb(15 23 42 / 0.9);
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello.</h1>
      <p>This static page is served by <code>Caddy</code> in a <code>Podman</code> container managed by a <code>Quadlet</code> systemd unit.</p>
    </main>
  </body>
</html>
